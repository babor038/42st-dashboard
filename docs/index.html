<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Marketing, SEO and AI Visibility Dashboard | 42nd Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* 42nd Street brand tokens, taken from 42st.com: charcoal panels, brand gold, warm ivory text */
  --bg:#171819;--surface:#222325;--surface2:#2b2c2f;--line:#ffffff1a;--ink:#f5f4f1;--muted:#a09a90;
  --gold:#cf9e44;--gold2:#dcaf5c;--gold-text:#cf9e44;--on-gold:#1b1810;
  --side:#121314;--side-ink:#f5f4f1;--side-muted:#97928a;
  --good:#6fd79a;--good-bg:#16301f;--soft:#e9c27a;--soft-bg:#33290f;
  --google:#7ea3ff;--bing:#43cbd8;--ga:#f5a24a;--ads:#a98cff;--ai:#ff7fae;--gbp:#9ad34a;
  --focus:#dcaf5c;
  --fh:'Afacad','Trebuchet MS',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'Afacad','Trebuchet MS',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){color-scheme:dark}
}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f8f6f2;--surface:#ffffff;--surface2:#efebe2;--line:#e2dccf;--ink:#232324;--muted:#5f5b53;
  --gold-text:#8a6413;
  --good:#17703f;--good-bg:#dcf1e4;--soft:#7a5600;--soft-bg:#fbefcf;
  --google:#2f62d9;--bing:#0a8f9c;--ga:#c96d0c;--ads:#7b4fe0;--ai:#c93a78;--gbp:#5a8f1a;
  --focus:#8a6413;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--fh);font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.12}
p{margin:0}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}

/* Sidebar: same charcoal panel and gold hairline as the 42st.com mega menu */
.side{background:var(--side);color:var(--side-ink);padding:26px 16px 20px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;display:flex;flex-direction:column;gap:24px;border-right:1px solid #ffffff14}
.brand{padding:0 8px 20px;border-bottom:1px solid #ffffff16;position:relative}
.brand::after{content:"";position:absolute;left:8px;bottom:-1px;width:44px;height:2px;background:var(--gold)}
.brand .bw{font-family:var(--fh);font-weight:700;font-size:30px;letter-spacing:-.03em;line-height:1.02;color:var(--side-ink)}
.brand .bs{font-size:14.5px;color:var(--side-muted);margin-top:8px;line-height:1.35}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--side-ink);padding:11px 12px 11px 14px;border-radius:6px;cursor:pointer;text-align:left;font-size:17px;font-weight:500;position:relative;transition:background .13s ease,color .13s ease}
.nav button::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;background:var(--gold);opacity:0;transition:opacity .13s ease}
.nav button:hover{background:#ffffff0b}
.nav button:hover::before{opacity:1}
.nav button[aria-current="page"]{background:#ffffff0f;color:#dcaf5c}
.nav button[aria-current="page"]::before{opacity:1}
.nav svg{width:18px;height:18px;flex:none;opacity:.8}
.side-foot{margin-top:auto;font-size:14px;color:var(--side-muted);line-height:1.45;border-top:1px solid #ffffff14;padding-top:16px}
.side-foot b{display:block;color:var(--gold);font-weight:600;font-size:15px;margin-bottom:4px}

/* Main */
.main{padding:0 clamp(16px,2.6vw,36px) 56px;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:20px 0 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.top h1{font-size:38px;letter-spacing:-.03em}
.top .sub{color:var(--muted);font-size:15.5px;margin-top:3px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font-size:15.5px;font-weight:500;line-height:1.2;display:inline-flex;align-items:center;gap:6px;transition:background .13s,border-color .13s,color .13s}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.btn.primary:hover{background:var(--gold2);border-color:var(--gold2)}
.btn.warn{color:var(--soft)}
.btn.small{padding:5px 11px;font-size:14.5px}
select,input[type=text],input[type=date],textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 11px;font-size:16px;max-width:100%}
select:hover,input[type=text]:hover,input[type=date]:hover,textarea:hover{border-color:#ffffff33}
:root[data-theme="light"] select:hover,:root[data-theme="light"] input:hover,:root[data-theme="light"] textarea:hover{border-color:#c9c1b0}
textarea{width:100%;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:15px;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--ink)}

.section{margin-top:30px}
.section>h2{font-size:28px;margin-bottom:4px}
.section>.lead{color:var(--muted);font-size:16px;margin-bottom:14px;max-width:72ch}
.lead{color:var(--muted)}
.group-h{display:flex;align-items:center;gap:10px;font-family:var(--fm);font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-text);margin:28px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c,var(--gold));border-radius:6px;padding:14px 16px 13px}
.kpi-l{font-size:15.5px;color:var(--muted)}
.kpi-v{font-family:var(--fh);font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.03em;margin:3px 0 7px;font-variant-numeric:tabular-nums}
.d{display:inline-block;font-size:14px;padding:2px 9px;border-radius:99px;font-weight:600}
.d.up{background:var(--good-bg);color:var(--good)}
.d.soft{background:var(--soft-bg);color:var(--soft)}
.d.flat{background:var(--surface2);color:var(--muted);font-weight:500}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0}
.card>h3{font-size:23px;margin-bottom:3px;letter-spacing:-.02em}
.card>.note,.note{color:var(--muted);font-size:15px;margin-bottom:10px}
.card.tint{background:transparent;border:1px dashed #cf9e4466;border-left:3px solid var(--gold)}

.chart{min-height:120px}
.lc-legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14.5px;color:var(--muted);margin:2px 0 6px}
.lc-legend span{display:inline-flex;align-items:center;gap:7px}
.lc-plot{position:relative}
.lc-plot svg{width:100%;height:auto;display:block;touch-action:pan-y}
.lc-plot text{font-family:var(--fb);font-size:12px;fill:var(--muted)}
.tip{position:absolute;top:6px;pointer-events:none;background:#f5f4f1;color:#171819;padding:7px 11px;border-radius:6px;font-size:14px;line-height:1.4;white-space:nowrap;z-index:5;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
:root[data-theme="light"] .tip{background:#232324;color:#f5f4f1}
.tip b{font-weight:700}
.empty-s{color:var(--muted);font-size:15px;padding:22px 4px}

.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,32%) 1fr auto;gap:12px;align-items:center;font-size:16px}
.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{background:var(--surface2);border-radius:3px;height:14px;overflow:hidden;display:flex}
.bar-fill{height:100%}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);min-width:48px;text-align:right}
.stack .bar-track{height:18px}

.tbl-tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tbl-tools input{flex:1;min-width:160px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:180px;max-width:520px;word-break:break-word}
th{background:var(--surface2);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#ffffff08}
:root[data-theme="light"] tbody tr:hover td{background:#00000006}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14.5px;margin-top:8px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#ffffff0d;border-radius:4px;padding:6px 15px;font-size:16px;font-weight:500;cursor:pointer;transition:all .13s}
:root[data-theme="light"] .chip{background:var(--surface)}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.tag{display:inline-block;background:var(--surface2);border-radius:4px;padding:1px 8px;font-size:14px;color:var(--muted);margin:2px 4px 2px 0}

.hero{background:var(--surface);border:1px solid #cf9e4433;border-left:3px solid var(--gold);border-radius:8px;padding:30px clamp(20px,4vw,42px);margin-top:20px}
.hero h2{font-size:40px;margin-bottom:10px;letter-spacing:-.03em}
.hero p{max-width:62ch;color:var(--muted);font-size:18px}
.hero .btn{margin-top:18px}
.hero .btn:first-of-type{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.hero .btn:first-of-type:hover{background:var(--gold2)}
.hl{margin:0;padding-left:20px}
.hl li{margin:5px 0}

.ds{display:flex;flex-direction:column;gap:9px}
.ds-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ds-status{font-size:15px;color:var(--muted)}
.ds-status.ok{color:var(--good)}
.ds-act{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.ds-act label{font-size:14.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.ds.drop{outline:2px dashed var(--gold);outline-offset:3px}
input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.form .chk{display:flex;gap:16px;align-items:center;padding-bottom:9px;font-size:16px}
.form .chk label{display:inline-flex;gap:7px;align-items:center}

.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell{display:inline-block;padding:2px 11px;border-radius:99px;font-size:14.5px;font-weight:600}
.cell.c{background:var(--good-bg);color:var(--good)}
.cell.m{background:var(--soft-bg);color:var(--soft)}
.cell.n{background:var(--surface2);color:var(--muted);font-weight:500}

.prog{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0 3px}
.prog>i{display:block;height:100%;background:var(--gold)}
.chk-row{display:grid;grid-template-columns:minmax(0,1fr) 190px minmax(120px,250px);gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.chk-row:last-child{border-bottom:0}
@media (max-width:760px){.chk-row{grid-template-columns:1fr}}

dialog{border:1px solid #cf9e4455;border-top:2px solid var(--gold);border-radius:8px;background:var(--surface);color:var(--ink);padding:0;width:min(700px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(8,9,10,.62)}
.dlg-in{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.dlg-in h3{font-size:27px}
.dlg-body{display:flex;flex-direction:column;gap:12px;font-size:16.5px;overflow:auto;max-height:56vh}
.dlg-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--soft);background:var(--soft-bg);padding:10px 12px;border-radius:6px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--on-gold);padding:10px 18px;border-radius:6px;font-size:16px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s;z-index:60;max-width:92vw;text-align:center;box-shadow:0 14px 40px -12px rgba(0,0,0,.6)}
.toast.on{opacity:1}
.foot{margin-top:40px;color:var(--muted);font-size:14.5px;border-top:1px solid var(--line);padding-top:16px}
.only-print{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;max-height:none;padding:14px 14px 10px;gap:12px;border-right:0;border-bottom:1px solid #ffffff14}
  .brand{padding:0 4px 12px}
  .brand .bw{font-size:26px}
  .brand .bs{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nav button{white-space:nowrap;padding:9px 13px}
  .nav button::before{left:12px;right:12px;top:auto;bottom:2px;width:auto;height:2px}
  .side-foot{display:none}
  .top h1{font-size:31px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  :root,:root[data-theme]{padding:0;--bg:#fff;--surface:#fff;--surface2:#efebe2;--line:#d9d2c3;--ink:#232324;--muted:#5f5b53;--gold-text:#8a6413;--good:#17703f;--good-bg:#dcf1e4;--soft:#7a5600;--soft-bg:#fbefcf;--google:#2f62d9;--bing:#0a8f9c;--ga:#c96d0c;--ads:#7b4fe0;--ai:#c93a78;--gbp:#5a8f1a}
  .side,.ctrls,.btn,.tbl-tools,.ds-act,.toast,.foot .no-print{display:none!important}
  .app{display:block}
  .top{position:static;border:0}
  .only-print{display:block;margin-bottom:8px;color:#8a6413;font-family:var(--fh);font-size:20px;font-weight:700}
  .card,.kpi{break-inside:avoid}
  .tip{display:none}
  body{background:#fff;color:#232324}
}

/* storage status, logo, forms */
.sync{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;color:var(--muted);padding:5px 11px;border:1px solid var(--line);border-radius:99px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="saved"]::before{background:var(--good)}
.sync[data-s="saving"]::before{background:var(--gold)}
.sync[data-s="local"]::before,.sync[data-s="error"]::before{background:var(--soft)}
.logo-wrap{display:flex;align-items:center}
.logo-wrap.plate-light{background:#f8f6f2;border-radius:6px;padding:12px 14px}
.logo{display:block;max-width:100%;max-height:170px;height:auto;width:auto;margin:0 auto}
.logo-prev{display:inline-block;background:#121314;border-radius:6px;padding:14px;margin-bottom:6px}
.logo-prev.plate-light{background:#f8f6f2}
.logo-prev img{display:block;max-height:120px;max-width:100%}
.mini{font-size:13.5px;color:var(--muted);line-height:1.3}
.form .wide{grid-column:1/-1}
.savebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.rowbtns{display:inline-flex;gap:6px}
.card textarea{min-height:80px}

</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Primary">
    <div class="brand" id="brand"></div>
    <nav class="nav" id="nav" aria-label="Dashboard sections"></nav>
    <div class="side-foot"><b>Be the company Google and AI recommend first.</b>Client data is stored in your connected workspace, not in this page.</div>
  </aside>
  <main class="main">
    <header class="top" id="top"></header>
    <div class="only-print" id="printHead"></div>
    <div id="view"></div>
    <div class="foot"><span id="footNote"></span></div>
  </main>
</div>
<dialog id="dlg"></dialog>
<input type="file" id="file" hidden accept=".csv,.tsv,.txt,text/csv,text/plain">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Local adapter: implements the doc-store interface on top of localStorage.
   Demo and development only. Data stays in one browser and is not shared between people. */
(function(){
  'use strict';
  var KEY='fs42_docs_v2',mem=null,listeners=[];
  function all(){
    if(mem)return mem;
    try{mem=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){mem={};}
    return mem;
  }
  function flush(){
    try{localStorage.setItem(KEY,JSON.stringify(mem));}
    catch(e){throw {code:'quota_exceeded',message:'Browser storage is full.'};}
  }
  function copy(x){return JSON.parse(JSON.stringify(x));}
  function parentOf(p){var i=p.lastIndexOf('/');return i<0?'':p.slice(0,i);}
  function idOf(p){return p.slice(p.lastIndexOf('/')+1);}
  function snapDoc(path){
    var d=all()[path];
    return {id:idOf(path),exists:d!==undefined,data:function(){return d===undefined?undefined:copy(d);},metadata:{fromCache:false,hasPendingWrites:false}};
  }
  function snapCol(col){
    var prefix=col+'/',docs=Object.keys(all()).filter(function(p){return p.indexOf(prefix)===0&&p.slice(prefix.length).indexOf('/')<0;}).sort().map(snapDoc);
    return {docs:docs,size:docs.length,empty:!docs.length,docChanges:function(){return [];},metadata:{fromCache:false,hasPendingWrites:false}};
  }
  function notify(path){
    setTimeout(function(){
      listeners.slice().forEach(function(l){
        if(l.kind==='doc'&&l.path===path)l.next(snapDoc(path));
        else if(l.kind==='col'&&l.path===parentOf(path))l.next(snapCol(l.path));
      });
    },0);
  }
  function listen(kind,path,next){
    var l={kind:kind,path:path,next:next};listeners.push(l);
    setTimeout(function(){if(listeners.indexOf(l)>=0)next(kind==='doc'?snapDoc(path):snapCol(path));},0);
    return function(){var i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1);};
  }
  function docRef(path){
    return {
      id:idOf(path),path:path,
      get:function(){return Promise.resolve(snapDoc(path));},
      set:function(data){try{all()[path]=copy(data);flush();}catch(e){return Promise.reject(e);}notify(path);return Promise.resolve();},
      delete:function(){delete all()[path];try{flush();}catch(e){return Promise.reject(e);}notify(path);return Promise.resolve();},
      onSnapshot:function(next){return listen('doc',path,next);}
    };
  }
  var db={
    doc:function(p){return docRef(p);},
    collection:function(p){
      return {
        path:p,
        get:function(){return Promise.resolve(snapCol(p));},
        onSnapshot:function(next){return listen('col',p,next);},
        doc:function(id){return docRef(p+'/'+id);}
      };
    }
  };
  window.FS42Adapters=window.FS42Adapters||{};
  window.FS42Adapters.local={init:function(){return Promise.resolve({db:db,uid:'local'});}};
})();

/* Supabase adapter: implements the doc-store interface on a single `documents` table
   protected by row level security (see supabase/schema.sql).
   Status: reference implementation, not yet exercised against a live Supabase project.
   Run it against a test project and review the policies before storing real client data. */
(function(){
  'use strict';
  var SDK='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js';
  var sbRef=null;

  function loadSdk(){
    return new Promise(function(res,rej){
      if(window.supabase&&window.supabase.createClient)return res();
      var s=document.createElement('script');s.src=SDK;s.onload=function(){res();};
      s.onerror=function(){rej(new Error('Could not load the Supabase client library.'));};
      document.head.appendChild(s);
    });
  }
  function parentOf(p){var i=p.lastIndexOf('/');return i<0?'':p.slice(0,i);}
  function idOf(p){return p.slice(p.lastIndexOf('/')+1);}
  function toErr(e){
    var code=e&&e.code,msg=(e&&e.message)||'Request failed';
    if(code==='42501'||/row-level security/i.test(msg))return {code:'invalid_argument',message:'You do not have permission to change this data.'};
    if(code==='54000'||/too large|payload/i.test(msg))return {code:'quota_exceeded',message:msg};
    return {code:'unavailable',message:msg};
  }
  function el(tag,css,html){var e=document.createElement(tag);if(css)e.style.cssText=css;if(html)e.innerHTML=html;return e;}

  function signIn(sb){
    return sb.auth.getSession().then(function(r){
      if(r&&r.data&&r.data.session)return r.data.session;
      return new Promise(function(resolve){
        var wrap=el('div','position:fixed;inset:0;z-index:100;background:rgba(8,9,10,.8);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Afacad,system-ui,sans-serif');
        var card=el('div','background:#222325;color:#f5f4f1;border:1px solid #cf9e4455;border-top:2px solid #cf9e44;border-radius:8px;padding:26px;max-width:420px;width:100%',
          '<h2 style="margin:0 0 6px;font-size:28px">Sign in</h2><p style="margin:0 0 16px;color:#a09a90;font-size:17px">Enter your work email and we will send you a sign-in link.</p>'+
          '<input id="fs42-email" type="email" autocomplete="email" placeholder="you@company.com" style="width:100%;padding:11px 12px;font-size:17px;border-radius:6px;border:1px solid #ffffff2a;background:#171819;color:#f5f4f1">'+
          '<button id="fs42-send" style="margin-top:12px;width:100%;padding:12px;font-size:17px;font-weight:600;border:0;border-radius:6px;background:#cf9e44;color:#1b1810;cursor:pointer">Email me a sign-in link</button>'+
          '<p id="fs42-msg" style="margin:12px 0 0;color:#a09a90;font-size:15px"></p>');
        wrap.appendChild(card);document.body.appendChild(wrap);
        var msg=card.querySelector('#fs42-msg');
        card.querySelector('#fs42-send').addEventListener('click',function(){
          var email=card.querySelector('#fs42-email').value.trim();
          if(!/^\S+@\S+\.\S+$/.test(email)){msg.textContent='Enter a valid email address.';return;}
          msg.textContent='Sending...';
          sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.href.split('#')[0]}}).then(function(x){
            msg.textContent=x.error?x.error.message:'Check your email and open the link. This page will continue automatically.';
          });
        });
        sb.auth.onAuthStateChange(function(ev,session){if(session){if(wrap.parentNode)wrap.parentNode.removeChild(wrap);resolve(session);}});
      });
    });
  }

  function findOrg(sb){
    return sb.from('members').select('org_id').limit(1).then(function(r){
      if(r.error)throw toErr(r.error);
      if(r.data&&r.data.length)return r.data[0].org_id;
      return sb.rpc('bootstrap_org',{org_name:'My agency'}).then(function(x){if(x.error)throw toErr(x.error);return x.data;});
    });
  }

  function makeDb(sb,org,uid){
    var listeners=[],timers={};
    function snapDoc(path,rec){
      return {id:idOf(path),exists:!!rec,data:function(){return rec?JSON.parse(JSON.stringify(rec.data)):undefined;},metadata:{fromCache:false,hasPendingWrites:false}};
    }
    function getDoc(path){
      return sb.from('documents').select('data').eq('org_id',org).eq('path',path).maybeSingle().then(function(r){
        if(r.error)throw toErr(r.error);return snapDoc(path,r.data);
      });
    }
    function getCol(col){
      return sb.from('documents').select('path,data').eq('org_id',org).eq('parent',col).order('path').then(function(r){
        if(r.error)throw toErr(r.error);
        var docs=(r.data||[]).map(function(x){return snapDoc(x.path,x);});
        return {docs:docs,size:docs.length,empty:!docs.length,docChanges:function(){return [];},metadata:{fromCache:false,hasPendingWrites:false}};
      });
    }
    var channel=null;
    function ensureChannel(){
      if(channel)return;
      channel=sb.channel('fs42-docs-'+org).on('postgres_changes',{event:'*',schema:'public',table:'documents',filter:'org_id=eq.'+org},function(p){
        var rec=(p.new&&p.new.path)?p.new:p.old;if(!rec||!rec.path)return;
        listeners.slice().forEach(function(l){
          if((l.kind==='doc'&&l.path===rec.path)||(l.kind==='col'&&l.path===parentOf(rec.path))){
            clearTimeout(timers[l.id]);
            timers[l.id]=setTimeout(function(){(l.kind==='doc'?getDoc(l.path):getCol(l.path)).then(l.next,l.error);},150);
          }
        });
      }).subscribe();
    }
    var seq=0;
    function listen(kind,path,next,error){
      ensureChannel();
      var l={id:++seq,kind:kind,path:path,next:next,error:error||function(){}};listeners.push(l);
      (kind==='doc'?getDoc(path):getCol(path)).then(next,l.error);
      return function(){var i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1);clearTimeout(timers[l.id]);};
    }
    function docRef(path){
      return {
        id:idOf(path),path:path,
        get:function(){return getDoc(path);},
        set:function(data){
          return sb.from('documents').upsert({org_id:org,path:path,parent:parentOf(path),data:data,updated_by:uid,updated_at:new Date().toISOString()},{onConflict:'org_id,path'}).then(function(r){if(r.error)throw toErr(r.error);});
        },
        delete:function(){
          return sb.from('documents').delete().eq('org_id',org).eq('path',path).then(function(r){if(r.error)throw toErr(r.error);});
        },

    connections:function(clientId){

    api:api,
    init:function(cfg){

    },

  };
})();

/* ---------- CSV parsing and import ---------- */
function parseCSV(text){
  text=String(text).replace(/^\uFEFF/,'');
  var lines=text.split(/\r?\n/),i=0;
  while(i<lines.length&&(!lines[i].trim()||lines[i].trim().charAt(0)==='#'))i++;
  var body=lines.slice(i).join('\n');
  var first=body.split('\n')[0]||'',delim=',',best=-1;
  [',','\t',';'].forEach(function(d){var n=first.split(d).length;if(n>best){best=n;delim=d;}});
  var rows=[],row=[],cur='',q=false;
  for(var p=0;p<body.length;p++){
    var ch=body[p];
    if(q){if(ch==='"'){if(body[p+1]==='"'){cur+='"';p++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&body[p+1]==='\n')p++;row.push(cur);cur='';if(row.some(function(x){return x.trim()!=='';}))rows.push(row);row=[];}
    else cur+=ch;
  }
  row.push(cur);if(row.some(function(x){return x.trim()!=='';}))rows.push(row);
  return rows;
}
function coerce(col,v){
  if(col.t==='date')return parseDate(v);
  if(col.t==='num')return parseNum(v);
  if(col.t==='pct'){var n=parseNum(v);if(n!=null&&String(v).indexOf('%')<0&&n>1)n=n/100;return n;}
  if(col.t==='bool')return parseBool(v);
  var s=v==null?'':String(v).trim();
  if(s===''&&col.def!==undefined)return col.def;
  return s;
}
function keyOf(ds,r){return ds.keys.map(function(k){return String(r[k]).toLowerCase();}).join('|');}
function ingest(c,key,text,merge){
  var ds=DS[key],rows=parseCSV(text);
  if(rows.length<2)return {err:'No data rows found. Make sure the file has a header row and at least one data row.'};
  var head=rows[0].map(normH),map={};
  ds.cols.forEach(function(col){var idx=-1;for(var a=0;a<col.al.length;a++){var j=head.indexOf(col.al[a]);if(j>=0){idx=j;break;}}map[col.k]=idx;});
  var missing=ds.cols.filter(function(col){return col.req&&map[col.k]<0;}).map(function(col){return col.al[0];});
  if(missing.length)return {err:'Missing required column(s): '+missing.join(', ')+'. Headers found: '+rows[0].join(', ')};
  var out=[],skipped=0;
  for(var r=1;r<rows.length;r++){
    var raw=rows[r],o={},ok=true;
    for(var i=0;i<ds.cols.length;i++){
      var col=ds.cols[i],v=map[col.k]>=0?raw[map[col.k]]:undefined,val=coerce(col,v);
      if(col.req&&(val==null||val==='')){ok=false;break;}
      o[col.k]=val;
    }
    if(!ok){skipped++;continue;}
    out.push(o);
  }
  if(!out.length)return {err:'No valid rows were found. '+skipped+' row(s) were skipped because a required value or date could not be read.'};
  var final;
  if(merge&&ds.keys){
    var m=new Map();
    (c.data[key]||[]).forEach(function(r){m.set(keyOf(ds,r),r);});
    out.forEach(function(r){m.set(keyOf(ds,r),r);});
    final=Array.from(m.values());
  }else final=out;
  if(key==='ai_log')final.forEach(function(r){if(!r.id)r.id=uid();});
  if(ds.keys&&ds.keys[0]==='date')final.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
  c.data[key]=final;
  return {added:out.length,skipped:skipped,total:final.length};
}

function deltaHTML(cur,prev,o){

var tables={};
function tableSlot(tid,cfg){
  tables[tid]=Object.assign({q:'',size:25,sort:null,dir:-1},cfg);
  var t=tables[tid];
  if(!t.sort){var nc=t.cols.filter(function(c){return c.num;})[0];t.sort=nc?nc.k:t.cols[0].k;}
  post.push(function(){mountTable(tid);});
  return '<div class="tbl" id="tb_'+tid+'"></div>';
}
function mountTable(tid){
  var t=tables[tid],el=document.getElementById('tb_'+tid);if(!el)return;
  el.innerHTML=(t.search===false?'':'<div class="tbl-tools"><input type="text" placeholder="Filter rows" data-tq="'+tid+'" aria-label="Filter rows"></div>')+'<div class="tbl-wrap" data-tbody="'+tid+'"></div><div class="tbl-foot" data-tfoot="'+tid+'"></div>';
  drawTable(tid);
}
function drawTable(tid){
  var t=tables[tid],body=document.querySelector('[data-tbody="'+tid+'"]'),foot=document.querySelector('[data-tfoot="'+tid+'"]');if(!body)return;
  var rows=t.rows.slice();
  if(t.q){var q=t.q.toLowerCase();rows=rows.filter(function(r){return t.cols.some(function(c){return String(r[c.k]==null?'':r[c.k]).toLowerCase().indexOf(q)>=0;});});}
  var sk=t.sort,dir=t.dir;
  rows.sort(function(a,b){var x=a[sk],y=b[sk];if(x==null)return 1;if(y==null)return -1;if(typeof x==='string')return dir*x.localeCompare(y);return dir*(x-y);});
  var shown=rows.slice(0,t.size);
  var h='<table><thead><tr>'+t.cols.map(function(c){return '<th class="'+(c.num?'num':'')+'" data-sort="'+tid+'|'+c.k+'" aria-sort="'+(sk===c.k?(dir>0?'ascending':'descending'):'none')+'">'+esc(c.l)+(sk===c.k?(dir>0?' \u25B2':' \u25BC'):'')+'</th>';}).join('')+'</tr></thead><tbody>';
  if(!shown.length)h+='<tr><td colspan="'+t.cols.length+'" style="color:var(--muted)">No matching rows.</td></tr>';
  shown.forEach(function(r){h+='<tr>'+t.cols.map(function(c){var v=c.f?c.f(r):r[c.k];return '<td class="'+(c.num?'num':(c.wrap?'wrap':''))+'">'+(c.raw?v:esc(v==null?'':v))+'</td>';}).join('')+'</tr>';});
  h+='</tbody></table>';body.innerHTML=h;
  foot.innerHTML='<span>Showing '+shown.length+' of '+rows.length+'</span>'+(rows.length>shown.length?'<button class="btn small" data-act="more" data-tid="'+tid+'">Show 25 more</button>':'');
}

var toastTimer=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on');},3600);}
function openDialog(title,bodyHTML,actions,onOpen){
  var d=$('#dlg');
  d.innerHTML='<div class="dlg-in"><h3>'+esc(title)+'</h3><div class="dlg-body">'+bodyHTML+'</div><div class="dlg-act">'+actions.map(function(a,i){return '<button class="btn'+(a.primary?' primary':'')+'" data-dlg="'+i+'">'+esc(a.label)+'</button>';}).join('')+'</div></div>';
  $$('[data-dlg]',d).forEach(function(b){b.addEventListener('click',function(){var a=actions[+b.dataset.dlg];var keep=a.fn?a.fn(d):undefined;if(keep!==false)closeDlg();});});
  if(d.showModal){if(!d.open)d.showModal();}else d.setAttribute('open','');
  if(onOpen)onOpen(d);
}
function closeDlg(){var d=$('#dlg');if(d.close)d.close();else d.removeAttribute('open');}
function askText(title,label,value,cb){
  openDialog(title,'<label class="f">'+esc(label)+'<input type="text" id="askv" value="'+esc(value||'')+'"></label>',[{label:'Cancel'},{label:'Save',primary:true,fn:function(d){var v=$('#askv',d).value.trim();if(!v)return false;cb(v);}}],function(d){var i=$('#askv',d);i.focus();i.select();i.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();var v=i.value.trim();if(v){cb(v);closeDlg();}}});});
}
function confirmDlg(title,msg,label,cb){openDialog(title,'<p>'+esc(msg)+'</p>',[{label:'Cancel'},{label:label,primary:true,fn:function(){cb();}}]);}
function showText(title,text,note,filename){
  var acts=[{label:'Close'}];
  if(filename&&cloud.dl){acts.push({label:'Download',fn:function(){cloud.dl.save({filename:filename,data:text}).then(function(){toast('Saved.');},function(e){if(!e||e.code!=='declined')toast('Download is not available here. Use Copy instead.');});return false;}});}
  acts.push({label:'Copy',primary:true,fn:function(d){copyText(text,$('#stext',d));return false;}});
  openDialog(title,(note?'<p>'+esc(note)+'</p>':'')+'<textarea id="stext" rows="12" readonly></textarea>',acts,function(d){$('#stext',d).value=text;});
}
function copyText(text,ta){
  function fallback(){try{ta.focus();ta.select();var ok=document.execCommand('copy');toast(ok?'Copied to clipboard':'Select the text and copy it manually');}catch(e){toast('Select the text and copy it manually');}}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('Copied to clipboard');},fallback);}else fallback();
}

function hasAny(c){return Object.keys(c.data).some(function(k){return c.data[k]&&c.data[k].length;});}
function emptyHero(){
  return '<div class="hero"><h2>Add your first export</h2><p>This dashboard shows only the numbers you bring in. Upload CSV exports from Google Search Console, Bing Webmaster Tools, Google Analytics 4, Google Business Profile and your ad platforms, or log AI visibility checks by hand. Column names from the native exports are recognised automatically.</p><button class="btn" data-act="nav" data-v="data">Go to Data and clients</button> <button class="btn" data-act="sample">Preview with sample data</button></div>';
}
function emptyState(msg){return '<div class="card tint"><h3>Nothing to show yet</h3><p class="note">'+esc(msg)+'</p><button class="btn" data-act="nav" data-v="data">Import data</button></div>';}
function windowNote(c,w){
  if(!w.end)return '';
  if(w.all)return '<p class="note" style="color:var(--muted);font-size:13px;margin-top:14px">Showing all available daily data, '+esc(longDate(w.start))+' to '+esc(longDate(w.end))+'.</p>';
  return '<p class="note" style="color:var(--muted);font-size:13px;margin-top:14px">Showing '+esc(longDate(w.start))+' to '+esc(longDate(w.end))+' ('+w.n+' days), compared with '+esc(longDate(w.pStart))+' to '+esc(longDate(w.pEnd))+'. Ranges end on the most recent date in your imported data.</p>';
}
function seriesOf(rows,w,k,name,color,fn){return {name:name,color:color,pts:byDate(inWin(rows,w.start,w.end),fn||function(r){return +r[k]||0;})};}

function viewOverview(c){
  if(!hasAny(c))return emptyHero();
  var w=windowFor(c),K=kpis(c,w),h=windowNote(c,w);
  var order=['o_clicks','g_clicks','g_imp','g_pos','b_clicks','b_imp','b_pos','ga_sessions','ga_events','ads_cost','ads_conv','gbp_actions','ai_mention','ai_cite'];
  var cards=order.filter(function(id){return K[id];}).map(function(id){return kpiCard(K[id]);});
  h+=cards.length?'<div class="kpis" style="margin-top:12px">'+cards.join('')+'</div>':'<div style="margin-top:12px">'+emptyState('Import a daily dataset (Search Console, Bing, GA4, Business Profile or ads) to see period totals and comparisons.')+'</div>';
  var gd=D(c,'gsc_daily'),bd=D(c,'bing_daily'),ga=D(c,'ga4_daily'),ch=D(c,'ga4_channels'),ai=D(c,'ai_log');
  h+='<div class="grid2">';
  if(gd.length||bd.length){
    var s=[];if(gd.length)s.push(seriesOf(gd,w,'clicks','Google','var(--google)'));if(bd.length)s.push(seriesOf(bd,w,'clicks','Bing','var(--bing)'));
    h+='<div class="card"><h3>Organic clicks by engine</h3><p class="note">Daily clicks from search results.</p>'+chartSlot(function(el){drawLine(el,s,{label:'Organic clicks by engine',legend:true});})+'</div>';
    var s2=[];if(gd.length)s2.push(seriesOf(gd,w,'impressions','Google','var(--google)'));if(bd.length)s2.push(seriesOf(bd,w,'impressions','Bing','var(--bing)'));
    h+='<div class="card"><h3>Impressions by engine</h3><p class="note">How often your pages appeared in results.</p>'+chartSlot(function(el){drawLine(el,s2,{label:'Impressions by engine',legend:true});})+'</div>';
  }
  if(ga.length){
    var s3=[seriesOf(ga,w,'sessions','Sessions','var(--ga)')];
    h+='<div class="card"><h3>Sessions</h3><p class="note">Daily sessions from Google Analytics 4.</p>'+chartSlot(function(el){drawLine(el,s3,{label:'Sessions',legend:true});})+'</div>';
  }
  if(ch.length){
    var items=ch.map(function(r){return {l:r.channel,v:r.sessions,c:'var(--ga)'};}).sort(function(a,b){return b.v-a.v;}).slice(0,8);
    h+='<div class="card"><h3>Sessions by channel</h3><p class="note">From your channel export, as exported.</p>'+barList(items)+'</div>';
  }
  if(ai.length)h+='<div class="card"><h3>AI visibility by platform</h3><p class="note">Share of logged checks where the brand appeared.</p>'+aiStackHTML(ai)+'</div>';
  h+=highlightsCard(c,K);
  h+='</div>';
  return h;
}
function highlightsCard(c,K){
  var out=[];
  Object.keys(K).forEach(function(id){
    var k=K[id];if(k.prev==null||k.cur==null||state.range==='all'||k.o.neutral)return;
    if(k.o.pos){if(k.prev-k.cur>=0.1)out.push(k.label+' improved by '+(k.prev-k.cur).toFixed(1)+' positions versus the previous period.');return;}
    if(k.prev>0){var p=(k.cur-k.prev)/k.prev*100;var good=k.o.inverse?p<=-1:p>=1;if(good)out.push(k.label+' '+(k.o.inverse?'came down':'grew')+' '+Math.abs(p).toFixed(1)+'% versus the previous period.');}
  });
  [['gsc_queries','Google'],['bing_queries','Bing']].forEach(function(p){
    var rows=D(c,p[0]);if(!rows.length)return;var t=rows.slice().sort(function(a,b){return b.clicks-a.clicks;})[0];
    if(t&&t.clicks>0)out.push('Top '+p[1]+' query by clicks: "'+t.query+'" with '+fmtNum(t.clicks)+' clicks.');
  });
  [['gsc_pages','Google'],['bing_pages','Bing']].forEach(function(p){
    var rows=D(c,p[0]);if(!rows.length)return;var t=rows.slice().sort(function(a,b){return b.clicks-a.clicks;})[0];
    if(t&&t.clicks>0)out.push('Top '+p[1]+' page by clicks: '+t.page+' with '+fmtNum(t.clicks)+' clicks.');
  });
  if(!out.length)return '';
  return '<div class="card"><h3>Highlights</h3><p class="note">Generated from your imported numbers.</p><ul class="hl">'+out.slice(0,8).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
}

function searchTableCols(dimKey,dimLabel){
  return [
    {k:dimKey,l:dimLabel,wrap:true},
    {k:'clicks',l:'Clicks',num:true,f:function(r){return fmtNum(r.clicks);}},
    {k:'impressions',l:'Impressions',num:true,f:function(r){return fmtNum(r.impressions);}},
    {k:'ctr',l:'CTR',num:true,f:function(r){return fmtPct(r.ctr!=null?r.ctr:(r.impressions?r.clicks/r.impressions:null));}},
    {k:'position',l:'Avg. position',num:true,f:function(r){return fmtPos(r.position);}}
  ];
}
function withCtr(rows){return rows.map(function(r){var o=Object.assign({},r);if(o.ctr==null&&o.impressions)o.ctr=o.clicks/o.impressions;return o;});}

function viewSearch(c){
  var ks=['gsc_daily','bing_daily','gsc_queries','bing_queries','gsc_pages','bing_pages'];
  if(!ks.some(function(k){return D(c,k).length;}))return emptyState('Import Google Search Console and Bing Webmaster Tools exports to compare search performance.');
  var w=windowFor(c),K=kpis(c,w),h=windowNote(c,w);
  var gd=D(c,'gsc_daily'),bd=D(c,'bing_daily');
  [['Google Search Console','var(--google)',['g_clicks','g_imp','g_ctr','g_pos']],['Bing Webmaster Tools','var(--bing)',['b_clicks','b_imp','b_ctr','b_pos']]].forEach(function(g){
    var cards=g[2].filter(function(id){return K[id];}).map(function(id){return kpiCard(K[id]);});
    if(cards.length)h+='<div class="group-h"><i class="dot" style="background:'+g[1]+'"></i>'+esc(g[0])+'</div><div class="kpis">'+cards.join('')+'</div>';
  });
  if(gd.length||bd.length){
    h+='<div class="grid2">';
    var defs=[['Clicks by engine','clicks',fmtNum,{}],['Impressions by engine','impressions',fmtNum,{}],['Click-through rate by engine','ctr',fmtPct,{zero:true}],['Average position by engine','position',function(v){return v.toFixed(1);},{invert:true,zero:false,axis:function(v){return v.toFixed(0);}}]];
    defs.forEach(function(d){
      var s=[];
      [[gd,'Google','var(--google)'],[bd,'Bing','var(--bing)']].forEach(function(e){
        if(!e[0].length)return;
        var rows=inWin(e[0],w.start,w.end),pts;
        if(d[1]==='ctr')pts=byDate(rows,function(r){return 0;}).map(function(p){var day=rows.filter(function(r){return r.date===p.x;});var a=sum(day,'clicks'),b=sum(day,'impressions');return {x:p.x,y:b?a/b:null};});
        else if(d[1]==='position')pts=rows.filter(function(r){return r.position!=null;}).map(function(r){return {x:r.date,y:r.position};});
        else pts=byDate(rows,function(r){return +r[d[1]]||0;});
        s.push({name:e[1],color:e[2],pts:pts});
      });
      var o=Object.assign({label:d[0],legend:true,fmt:d[2]},d[3]);
      if(d[1]==='ctr')o.axis=function(v){return (v*100).toFixed(1)+'%';};
      h+='<div class="card"><h3>'+esc(d[0])+'</h3>'+(d[1]==='position'?'<p class="note">Lower numbers are higher in results, so the chart shows better positions nearer the top.</p>':'<p class="note">Daily values in the selected range.</p>')+chartSlot(function(el){drawLine(el,s,o);})+'</div>';
    });
    h+='</div>';
  }
  var brand=(c.brand||'').split(',').map(function(x){return x.trim().toLowerCase();}).filter(Boolean);
  if(brand.length){
    var bh='';
    [['Google','gsc_queries','var(--google)'],['Bing','bing_queries','var(--bing)']].forEach(function(e){
      var rows=D(c,e[1]);if(!rows.length)return;
      var br=0,nb=0;rows.forEach(function(r){var q=String(r.query).toLowerCase();if(brand.some(function(t){return q.indexOf(t)>=0;}))br+=r.clicks;else nb+=r.clicks;});
      bh+='<div style="margin-bottom:12px"><b>'+e[0]+'</b>'+barList([{l:'Branded queries',v:br,c:e[2]},{l:'Non-branded queries',v:nb,c:'var(--gold)'}])+'</div>';
    });
    if(bh)h+='<div class="section"><div class="card"><h3>Branded and non-branded clicks</h3><p class="note">Based on the brand terms saved for this client, applied to the queries export.</p>'+bh+'</div></div>';
  }
  var eng=state.eng==='bing'?'bing':'google',pre=eng==='bing'?'bing':'gsc';
  var q=D(c,pre+'_queries'),p=D(c,pre+'_pages');
  h+='<div class="section"><h2>Queries and pages</h2><div class="chips" role="group" aria-label="Search engine">'+
     '<button class="chip" data-act="eng" data-e="google" aria-pressed="'+(eng==='google')+'">Google</button><button class="chip" data-act="eng" data-e="bing" aria-pressed="'+(eng==='bing')+'">Bing</button></div>';
  if(!q.length&&!p.length)h+='<div style="margin-top:12px">'+emptyState('Import the '+(eng==='bing'?'Bing':'Google')+' Queries or Pages export to see this table.')+'</div>';
  else{
    h+='<div class="grid2">';
    if(q.length){
      var opp=withCtr(q).filter(function(r){return r.position!=null&&r.position>=4&&r.position<=15&&r.impressions>0;});
      h+='<div class="card" style="grid-column:1/-1"><h3>Growth opportunities: queries at positions 4 to 15</h3><p class="note">These queries already earn impressions and sit close to the top results. Sorted by impressions, so the biggest opportunities come first.</p>'+
        (opp.length?tableSlot('opp_'+pre,{cols:searchTableCols('query','Query'),rows:opp,sort:'impressions'}):'<div class="empty-s">No queries in the 4 to 15 range in this export.</div>')+'</div>';
      h+='<div class="card" style="grid-column:1/-1"><h3>Top queries</h3><p class="note">As exported, not limited by the date range above.</p>'+tableSlot('q_'+pre,{cols:searchTableCols('query','Query'),rows:withCtr(q),sort:'clicks'})+'</div>';
    }
    if(p.length)h+='<div class="card" style="grid-column:1/-1"><h3>Top pages</h3><p class="note">As exported, not limited by the date range above.</p>'+tableSlot('p_'+pre,{cols:searchTableCols('page','Page'),rows:withCtr(p),sort:'clicks'})+'</div>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}

  }
  return h;

function viewLocalPaid(c){
  var gb=D(c,'gbp_daily'),ad=D(c,'ads_daily');

  return c.info[k]||'';
}
function fieldHTML(c,f){
  var v=infoVal(c,f.k),wide=(f.t==='textarea'||f.w)?' wide':'',inner;
  if(f.t==='textarea')inner='<textarea rows="3" data-info="'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';

  return '<label class="f'+wide+'">'+esc(f.l)+inner+'</label>';

function infoCompleteness(c){

function saveInfo(c){
  var inf=Object.assign({},c.info);
  $$('[data-info]').forEach(function(el){
    var k=el.dataset.info,v=el.value.trim();
    if(k==='_name')c.name=v||c.name;
    else if(k==='_domain')c.domain=v;
    else if(k==='_brand')c.brand=v;
    else if(k==='_currency')c.currency=v||'$';
    else inf[k]=v;
  });
  var comps=[];
  for(var i=0;i<5;i++){
    var n=$('[data-comp="n'+i+'"]'),u=$('[data-comp="u'+i+'"]'),t=$('[data-comp="t'+i+'"]');
    var o={name:n?n.value.trim():'',url:u?u.value.trim():'',notes:t?t.value.trim():''};
    if(o.name||o.url||o.notes)comps.push(o);
  }
  inf.competitors=comps;inf._saved=isoOf(new Date());
  c.info=inf;formDirty=false;saveClient(c);
}

function nq(s){return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();}
function pageIs(rowPage,target){
  var t=String(target||'').trim().toLowerCase();if(!t)return false;
  var a=String(rowPage||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/[?#].*$/,'').replace(/\/+$/,'');
  if(t.charAt(0)==='/'){var tp=t.replace(/[?#].*$/,'').replace(/\/+$/,''),i=a.indexOf('/'),path=i<0?'':a.slice(i);return path===tp;}
  return a===t.replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/[?#].*$/,'').replace(/\/+$/,'');
}
function aggRows(rows,fn){
  var n=0,clicks=0,imp=0,pw=0,pi=0,one=null;
  rows.forEach(function(r){if(!fn(r))return;n++;one=r;clicks+=r.clicks||0;imp+=r.impressions||0;if(r.position!=null&&r.impressions){pw+=r.position*r.impressions;pi+=r.impressions;}});
  if(!n)return {n:0,clicks:null,imp:null,ctr:null,pos:null};
  var pos=pi?pw/pi:(n===1&&one.position!=null?one.position:null);
  return {n:n,clicks:clicks,imp:imp,ctr:imp?clicks/imp:null,pos:pos};
}
function engRows(c,eng,kind){return D(c,(eng==='bing'?'bing':'gsc')+'_'+kind);}
function kwStats(c,eng,text){var t=nq(text);return aggRows(engRows(c,eng,'queries'),function(r){var q=nq(r.query);return state.variants?q.indexOf(t)>=0:q===t;});}
function areaStats(c,eng,a){
  var terms=[a.name].concat(String(a.terms||'').split(',')).map(nq).filter(Boolean);
  return aggRows(engRows(c,eng,'queries'),function(r){var q=nq(r.query);return terms.some(function(t){return q.indexOf(t)>=0;});});
}
function pageStats(c,eng,page){return aggRows(engRows(c,eng,'pages'),function(r){return pageIs(r.page,page);});}
function logFor(c,item){
  var t=nq(item),rows=D(c,'rank_log').filter(function(r){return nq(r.item)===t;}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
  if(!rows.length)return null;
  var cur=rows[rows.length-1],same=rows.filter(function(r){return nq(r.engine)===nq(cur.engine);}),prev=same.length>1?same[same.length-2]:null;
  return {cur:cur,prev:prev};
}
function posCell(p){
  if(p==null||!isFinite(p))return '<span class="cell n">Not in export</span>';
  var cl=p<=3.49?'c':(p<=10.49?'m':'n');
  return '<span class="cell '+cl+'">'+p.toFixed(1)+'</span>';
}
function nz(v,f){return v==null?'-':f(v);}
function logCell(lg){
  if(!lg)return '<span class="cell n">Not logged</span>';
  var h=posCell(lg.cur.position)+' <span class="mini">'+esc(lg.cur.engine)+'</span>';
  if(lg.prev){var d=lg.prev.position-lg.cur.position;if(Math.abs(d)>=0.05)h+=' <span class="d '+(d>0?'up':'soft')+'">'+(d>0?'\u25B2 ':'\u25BC ')+Math.abs(d).toFixed(1)+'</span>';}
  return h;
}
function bestGoogle(g,lg){
  if(lg&&/google/i.test(lg.cur.engine)&&!/map/i.test(lg.cur.engine))return lg.cur.position;
  return g.pos;
}
function rowBtns(kind,id){return '<span class="rowbtns"><button class="btn small" data-act="tr-edit" data-kind="'+kind+'" data-id="'+esc(id)+'">Edit</button><button class="btn small warn" data-act="tr-del" data-kind="'+kind+'" data-id="'+esc(id)+'">Remove</button></span>';}
function trackingUnion(c){
  var out=[];
  c.tracking.keywords.forEach(function(k){out.push(k.text);});
  c.tracking.areas.forEach(function(a){out.push(a.name);});
  c.tracking.services.forEach(function(s){out.push(s.name);});
  return out;
}

function parseBulk(kind,text){
  var out=[];
  String(text).split(/\r?\n/).forEach(function(line){
    var p=line.split('|').map(function(x){return x.trim();});
    if(!p[0])return;
    if(kind==='keywords')out.push({id:uid(),text:p[0],page:p[1]||'',note:p[2]||''});
    else if(kind==='areas')out.push({id:uid(),name:p[0],type:p[1]||'',page:p[2]||'',terms:p[3]||'',note:''});
    else out.push({id:uid(),name:p[0],keyword:p[1]||'',page:p[2]||'',note:''});
  });
  return out;
}

  services:[['name','Main service'],['keyword','Primary keyword'],['page','Target page'],['note','Note']]
};
function editItem(c,kind,id){
  var list=c.tracking[kind],item=list.filter(function(x){return x.id===id;})[0];if(!item)return;
  var fields=EDIT_FIELDS[kind];
  openDialog('Edit '+(kind==='keywords'?'keyword':kind==='areas'?'service area':'service'),
    fields.map(function(f,i){return '<label class="f">'+esc(f[1])+'<input type="text" id="ed_'+i+'" value="'+esc(item[f[0]]||'')+'"></label>';}).join(''),
    [{label:'Cancel'},{label:'Save',primary:true,fn:function(d){
      fields.forEach(function(f,i){item[f[0]]=$('#ed_'+i,d).value.trim();});
      if(!(item.text||item.name))return false;
      saveClient(c);render();
    }}]);
}

function connAction(a,t,c){
  var api=connApi();if(!api){toast('Live connections need the cloud backend.');return;}
  if(a==='conn-refresh'){loadConnections(c);toast('Refreshing.');return;}
  if(a==='conn-google'){
    api.invoke('connect',{action:'google-start',clientId:c.id,product:t.dataset.p}).then(function(r){window.location.href=r.url;},connErr);return;
  }
  if(a==='conn-bing'){
    var key=($('#bing_key')||{}).value;if(!key||!key.trim()){toast('Paste the Bing API key first.');return;}
    api.invoke('connect',{action:'bing-save',clientId:c.id,apiKey:key.trim()}).then(function(){toast('Bing key saved.');loadConnections(c);},connErr);return;
  }
  if(a==='conn-sync'){
    var only=t.dataset.p?[t.dataset.p]:null;toast('Syncing. This can take a minute.');
    api.invoke('sync',{clientId:c.id,providers:only,days:Number(connState.days)||90}).then(function(r){
      var res=[];(r.synced||[]).forEach(function(x){res=res.concat(x.results||[]);});
      var ok=res.filter(function(x){return x.ok;}).length,bad=res.filter(function(x){return !x.ok;});
      toast(!res.length?'Nothing connected to sync yet.':(ok+' source'+(ok===1?'':'s')+' updated'+(bad.length?', '+bad.length+' need attention.':'.')));
      loadConnections(c);
    },connErr);return;
  }
  if(a==='conn-disc'){
    var p=t.dataset.p;
    confirmDlg('Disconnect '+p.toUpperCase()+'?','The stored sign-in is deleted. Data already pulled stays in the dashboard.','Disconnect',function(){api.invoke('connect',{action:'disconnect',clientId:c.id,provider:p}).then(function(){toast('Disconnected.');loadConnections(c);},connErr);});return;
  }
  if(a==='conn-find'){
    var prov=CONN.filter(function(x){return x.id===t.dataset.p;})[0];
    api.invoke('connect',{action:'discover',clientId:c.id,provider:prov.id}).then(function(r){
      var opts=r.options||[];
      if(!opts.length){toast('Nothing found for that Google account.');return;}
      openDialog('Choose '+prov.fieldLabel.toLowerCase(),'<label class="f">'+esc(prov.fieldLabel)+'<select id="disc_sel">'+opts.map(function(o,i){return '<option value="'+i+'">'+esc(o.label)+'</option>';}).join('')+'</select></label>',
        [{label:'Cancel'},{label:'Use this',primary:true,fn:function(d){var o=opts[Number($('#disc_sel',d).value)];c.info[prov.field]=o.value;saveClient(c);render();toast('Saved to Client info.');}}]);
    },connErr);
  }
}

var pendingUpload=null;
function doImport(key,text){
  var c=C(),res=ingest(c,key,text,mergePref(key));
  if(res.err)return res;
  saveDataset(c,key);render();
  toast('Imported '+res.added+' rows into '+DS[key].grp+': '+DS[key].title+(res.skipped?' ('+res.skipped+' skipped)':'')+'.');
  return res;
}
function readFile(file,key){
  var fr=new FileReader();
  fr.onload=function(){var res=doImport(key,String(fr.result));if(res&&res.err)openDialog('Import problem','<div class="err">'+esc(res.err)+'</div>',[{label:'Close',primary:true}]);};
  fr.onerror=function(){toast('That file could not be read.');};
  fr.readAsText(file);
}
function setLogo(url){state.agency.logo=url;saveAgency();renderBrand();render();toast('Logo saved.');}
function processLogo(file){
  var isSvg=/svg/i.test(file.type)||/\.svg$/i.test(file.name),fr=new FileReader();
  if(isSvg){
    fr.onload=function(){
      var txt=String(fr.result);
      if(txt.length>180000){toast('That SVG is too large. Use one under about 180 KB.');return;}
      txt=txt.replace(/<script[\s\S]*?<\/script>/gi,'');
      var b64;try{b64=btoa(unescape(encodeURIComponent(txt)));}catch(e){toast('That SVG could not be read.');return;}
      setLogo('data:image/svg+xml;base64,'+b64);
    };
    fr.readAsText(file);
  }else{
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var sc=Math.min(1,520/img.width,160/img.height),cv=document.createElement('canvas');
          cv.width=Math.max(1,Math.round(img.width*sc));cv.height=Math.max(1,Math.round(img.height*sc));
          cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
          var url=cv.toDataURL('image/png');
          if(url.length>190000)url=cv.toDataURL('image/webp',0.85);
          if(url.length>190000){toast('That image is too large. Try a smaller or simpler file, or an SVG.');return;}
          setLogo(url);
        }catch(e){toast('That image could not be processed.');}
      };
      img.onerror=function(){toast('That image could not be read.');};
      img.src=String(fr.result);
    };
    fr.readAsDataURL(file);
  }
}
function slug(s){return String(s||'client').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'client';}
var NEEDS_NO_CLIENT=['nav','theme','print','newclient','sample','restore','logo-up','logo-rm','migrate','signout','more'];

    case 'nav':state.view=t.dataset.v;formDirty=false;savePrefs();render();window.scrollTo(0,0);break;
    case 'theme':state.theme=state.theme==='light'?'dark':'light';applyTheme();savePrefs();break;
    case 'print':try{window.print();}catch(err){toast('Use your browser print shortcut (Ctrl or Cmd + P) to save a PDF.');}break;
    case 'eng':state.eng=t.dataset.e;savePrefs();render();break;
    case 'more':{var tb2=tables[t.dataset.tid];if(tb2){tb2.size+=25;drawTable(t.dataset.tid);}break;}
    case 'newclient':askText('Add client','Client name','',function(name){var nc=newClient(name);createClient(nc);state.view='clientinfo';savePrefs();render();toast('Added '+name+'. Fill in the client info to get started.');});break;
    case 'sample':{
      var old=state.order.filter(function(i){return state.clients[i].sample;})[0];

      state.range='28';state.view='overview';savePrefs();render();window.scrollTo(0,0);toast('Sample client loaded. All numbers are invented.');break;}
    case 'delclient':confirmDlg('Delete '+c.name+'?','This permanently removes this client, its client info, tracking lists and all imported data from storage. Back it up first if you might need it.','Delete client',function(){deleteClient(c.id);render();toast('Client deleted.');});break;
    case 'backup':showText('Backup for '+c.name,JSON.stringify(stripClient(c)),'Copy or download this text and keep it somewhere safe. Use Restore from backup to load it again as a new client.',slug(c.name)+'-backup.json');break;
    case 'restore':openDialog('Restore from backup','<p>Paste a backup you saved earlier. It will be added as a new client.</p><textarea id="rtext" rows="8"></textarea><div id="rerr"></div>',[{label:'Cancel'},{label:'Restore',primary:true,fn:function(d){
      try{
        var o=JSON.parse($('#rtext',d).value);if(!o||typeof o!=='object'||!o.data)throw new Error('This does not look like a backup from this dashboard.');
        var nc=newClient(String(o.name||'Restored client')+' (restored)');
        nc.domain=String(o.domain||'');nc.brand=String(o.brand||'');nc.currency=String(o.currency||'$');nc.sample=!!o.sample;
        nc.info=o.info||{};nc.tracking=o.tracking||{};nc.checks=o.checks||{};nc.data=o.data||{};
        createClient(nc);render();toast('Backup restored as a new client.');
      }catch(err){$('#rerr',d).innerHTML='<div class="err">'+esc(err.message)+'</div>';return false;}}}]);break;
    case 'upload':pendingUpload=t.dataset.k;$('#file').accept='.csv,.tsv,.txt,text/csv,text/plain';$('#file').value='';$('#file').click();break;
    case 'paste':{var k=t.dataset.k;openDialog('Paste '+DS[k].grp+': '+DS[k].title,'<p>Paste CSV or tab separated text including the header row.</p><textarea id="ptext" rows="10" placeholder="'+esc(DS[k].cols.map(function(x){return x.al[0];}).join(','))+'"></textarea><div id="perr"></div>',[{label:'Cancel'},{label:'Import',primary:true,fn:function(d){var res=doImport(k,$('#ptext',d).value);if(res&&res.err){$('#perr',d).innerHTML='<div class="err">'+esc(res.err)+'</div>';return false;}}}]);break;}
    case 'template':{var k2=t.dataset.k;showText('Template: '+DS[k2].grp+', '+DS[k2].title,DS[k2].cols.map(function(x){return x.al[0];}).join(',')+'\n','Use this header row in a spreadsheet, add your data underneath, save as CSV and upload it. Native exports from the platform work without changes.',k2+'-template.csv');break;}
    case 'clear':{var k3=t.dataset.k;confirmDlg('Clear '+DS[k3].title+'?','This removes the imported '+DS[k3].grp+' '+DS[k3].title.toLowerCase()+' data for '+c.name+'.','Clear data',function(){delete c.data[k3];saveDataset(c,k3);render();toast('Data cleared.');});break;}
    case 'ai-add':{
      var date=parseDate($('#ai_date').value),plat=$('#ai_plat').value.trim(),prompt=$('#ai_prompt').value.trim();
      if(!date||!plat||!prompt){toast('Add a date, a platform and the prompt you tested.');break;}
      var row={date:date,platform:plat,prompt:prompt,mentioned:$('#ai_men').checked,cited:$('#ai_cit').checked,competitors:$('#ai_comp').value.trim(),notes:$('#ai_notes').value.trim(),id:uid()};
      var list=(c.data.ai_log||[]).slice(),kk=keyOf(DS.ai_log,row),idx=-1;
      list.forEach(function(r,i){if(keyOf(DS.ai_log,r)===kk)idx=i;});
      if(idx>=0)list[idx]=row;else list.push(row);
      c.data.ai_log=list;saveDataset(c,'ai_log');render();toast('Check added to the log.');break;}
    case 'ai-del':c.data.ai_log=(c.data.ai_log||[]).filter(function(r){return r.id!==t.dataset.id;});saveDataset(c,'ai_log');render();break;
    case 'save-info':saveInfo(c);render();toast('Client info saved.');break;
    case 'tr-bulk':{
      var kind=t.dataset.kind,ta=$('#bulk_'+kind),items=parseBulk(kind,ta?ta.value:'');
      if(!items.length){toast('Enter at least one line first.');break;}
      var cur=c.tracking[kind];
      if(cur.length+items.length>TRACK_MAX){toast('You can track up to '+TRACK_MAX+' in this list. Remove some first.');break;}
      c.tracking[kind]=cur.concat(items);saveClient(c);render();toast('Added '+items.length+'.');break;}
    case 'tr-del':{var kd=t.dataset.kind,did=t.dataset.id;c.tracking[kd]=c.tracking[kd].filter(function(x){return x.id!==did;});saveClient(c);render();break;}

      if(!rd||!ri||rp==null||rp<=0){toast('Add a date, an item and a position.');break;}

      var rl=(c.data.rank_log||[]).slice(),rk=keyOf(DS.rank_log,rrow),ri2=-1;
      rl.forEach(function(r,i){if(keyOf(DS.rank_log,r)===rk)ri2=i;});
      if(ri2>=0)rl[ri2]=rrow;else rl.push(rrow);
      rl.sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0;});

    case 'logo-up':pendingUpload='__logo__';$('#file').accept='image/svg+xml,image/png,image/jpeg,image/webp,.svg,.png,.jpg,.jpeg,.webp';$('#file').value='';$('#file').click();break;
    case 'logo-rm':state.agency.logo='';saveAgency();renderBrand();render();toast('Custom logo removed. The default logo is back.');break;
    case 'migrate':{var n=migrateLegacy();render();toast(n?'Moved '+n+' client'+(n===1?'':'s')+' to cloud storage.':'Nothing to move.');break;}
    case 'conn-refresh':case 'conn-google':case 'conn-bing':case 'conn-sync':case 'conn-disc':case 'conn-find':connAction(a,t,c);break;
    case 'signout':if(window.FS42Adapters&&FS42Adapters.supabase)FS42Adapters.supabase.signOut();break;
  }
});

  else if(t.dataset&&t.dataset.check){var c=C();c.checks[t.dataset.check]=Object.assign({},c.checks[t.dataset.check],{s:t.value});saveClient(c);render();}
  else if(t.dataset&&t.dataset.merge){mergePrefs[t.dataset.merge]=t.checked;}

['dragover','dragleave','drop'].forEach(function(ev){
